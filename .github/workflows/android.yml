name: APK Android

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KLAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests
        run: node --test test/*.test.mjs

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Préparation Capacitor
        run: |
          node scripts/prepare-android.mjs web
          npx cap add android
          node scripts/prepare-android.mjs native
          npx cap sync android

      - name: Fabrication (release non signée)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Signature
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.KLAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KLAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KLAD_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/klad.jks"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          VER=$(node -p "require('./package.json').version")
          OUT="klad-$VER-${GITHUB_RUN_NUMBER}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/klad.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -i 'SHA-256' || true
          rm -f "$RUNNER_TEMP/klad.jks"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Fabrication de secours (debug, sans clé de signature)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::Secrets de signature absents : APK debug seulement (non publiable, mises à jour impossibles)."
          ./gradlew --no-daemon assembleDebug

      - name: APK debug
        if: env.HAS_KEY != 'true'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "klad-debug-${GITHUB_RUN_NUMBER}.apk"
          echo "APK=klad-debug-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: klad-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publication (Releases)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Klad $TAG" --prerelease \
              --notes "Prototype de faisabilité. Installer l'APK, puis suivre la mise en place sur le site."
          fi
