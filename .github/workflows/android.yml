name: APK Android

# Demande de fusion : tests + fabrication (vérification avant fusion, rien n'est publié).
# main : fabrication de l'APK signé ; si la version de package.json n'a pas encore de publication,
#        création de l'étiquette v<version> et de la publication dans Releases avec l'APK.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KLAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Tests
        run: node --test test/*.test.mjs

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node scripts/version.mjs)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Version $TAG déjà publiée : fabrication seule."
            else
              echo "Nouvelle version $TAG : publication après la fabrication."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Préparation Capacitor
        run: |
          node scripts/prepare-android.mjs web
          node scripts/prepare-android.mjs native
          npx cap sync android

      - name: Tests Java (coffre)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Fabrication (release non signée)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Signature
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.KLAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KLAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KLAD_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/klad.jks"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          VER=$(node -p "require('./package.json').version")
          OUT="klad-$VER-${GITHUB_RUN_NUMBER}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/klad.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -i 'SHA-256' || true
          rm -f "$RUNNER_TEMP/klad.jks"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Fabrication de secours (debug, sans clé de signature)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::Secrets de signature absents : APK debug seulement (non publiable, mises à jour impossibles)."
          ./gradlew --no-daemon assembleDebug

      - name: APK debug
        if: env.HAS_KEY != 'true'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "klad-debug-${GITHUB_RUN_NUMBER}.apk"
          echo "APK=klad-debug-${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: klad-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publication (Releases)
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::Secrets de signature absents : $TAG non publiée (un APK debug ne peut pas être publié)."
            exit 1
          fi
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Klad $TAG" --latest \
            --notes "Installer l'APK, puis suivre la mise en place sur le site."
