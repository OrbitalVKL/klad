<style>
:root{
  --bg:#f3f5f2; --surface:#fff; --surface-2:#eef1ed; --ink:#14201c; --ink-2:#3f4a45; --muted:#5b6661; --line:#dde2dd;
  --accent:#23456e; --accent-ink:#fff; --accent-soft:#e3eaf3; --brand:#9E4A4A; --tab-on:#23456e;
  --good:#1a7347; --good-soft:#e2f2e8; --warn:#8a560c; --warn-soft:#fbf0dc; --bad:#a8321f; --bad-soft:#fbe6e1;
  --hero:#23456e; --hero-ink:#fff; --hero-2:#d7e2f0;
  --bar:#2a78d6; --bar-2:#eb6834;
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --tb:68px; --bar-h:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191e1c; --surface-2:#202624; --ink:#edf1ee; --ink-2:#c3ccc7; --muted:#9aa49f; --line:#2d3532;
    --accent:#9dbbe4; --accent-ink:#0f1a28; --accent-soft:#1f2c3b; --brand:#c46a6a; --tab-on:#9dbbe4;
    --good:#5cc08c; --good-soft:#1b2d23; --warn:#e2a846; --warn-soft:#2f2616; --bad:#f08a76; --bad-soft:#35201b;
    --hero:#1e3a5c; --hero-ink:#eef3fa; --hero-2:#c8d6ea; --bar:#3987e5; --bar-2:#d95926;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191e1c; --surface-2:#202624; --ink:#edf1ee; --ink-2:#c3ccc7; --muted:#9aa49f; --line:#2d3532;
  --accent:#9dbbe4; --accent-ink:#0f1a28; --accent-soft:#1f2c3b; --brand:#c46a6a; --tab-on:#9dbbe4;
  --good:#5cc08c; --good-soft:#1b2d23; --warn:#e2a846; --warn-soft:#2f2616; --bad:#f08a76; --bad-soft:#35201b;
  --hero:#1e3a5c; --hero-ink:#eef3fa; --hero-2:#c8d6ea; --bar:#3987e5; --bar-2:#d95926;
}
/* Palette « Grafit » : chrome noir, rouge réservé à la marque (logo, onglet actif) */
:root[data-palette="grafit"]{ --bg:#f4f3f1; --surface:#fff; --surface-2:#efedea; --ink:#0A0C0E; --ink-2:#3d4247; --muted:#5f6368; --line:#e2dfdb;
  --accent:#0A0C0E; --accent-ink:#fff; --accent-soft:#ecebe8; --tab-on:#9E4A4A; --hero:#0A0C0E; --hero-ink:#f4f3f1; --hero-2:#d9d5d0; }
@media (prefers-color-scheme: dark){
  :root[data-palette="grafit"]:not([data-theme="light"]){ --bg:#0A0C0E; --surface:#14171a; --surface-2:#1c2024; --ink:#eeeae6; --ink-2:#c9c4be; --muted:#a09a94; --line:#2a2e33;
    --accent:#eeeae6; --accent-ink:#0A0C0E; --accent-soft:#23272c; --tab-on:#d27c7c; --hero:#1a1d21; --hero-ink:#f4f1ed; --hero-2:#c9c4be; }
}
:root[data-palette="grafit"][data-theme="dark"]{ --bg:#0A0C0E; --surface:#14171a; --surface-2:#1c2024; --ink:#eeeae6; --ink-2:#c9c4be; --muted:#a09a94; --line:#2a2e33;
  --accent:#eeeae6; --accent-ink:#0A0C0E; --accent-soft:#23272c; --tab-on:#d27c7c; --hero:#1a1d21; --hero-ink:#f4f1ed; --hero-2:#c9c4be; }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* barre de la maquette (hors appli) */
.mq{position:relative;z-index:30;background:#2b2f36;color:#f2f2f2;font-size:13px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mq b{font-weight:700}
.mq .grp{display:flex;border:1px solid #5b616b;border-radius:10px;overflow:hidden}
.mq .grp button{all:unset;cursor:pointer;min-height:36px;padding:0 10px;display:flex;align-items:center;color:#e8e8e8}
.mq .grp button[aria-pressed="true"]{background:#f2f2f2;color:#1b1d22;font-weight:700}
.mq .cpt{margin-left:auto;display:flex;gap:6px;align-items:center}
.mq .cpt button,.mq .aide{all:unset;cursor:pointer;min-height:36px;padding:0 10px;border:1px solid #5b616b;border-radius:10px;display:flex;align-items:center}
.mq-guide{background:#2b2f36;color:#eee;font-size:13.5px;padding:4px 14px 12px;border-top:1px solid #444}
.mq-guide h3{margin:8px 0 4px;font-size:14px}
.mq-guide ol,.mq-guide ul{margin:4px 0;padding-left:20px}
.mq-guide li{margin:2px 0}

/* coquille de l'appli */
.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--tb) + 24px + env(safe-area-inset-bottom))}
.ah{display:flex;align-items:flex-end;gap:8px;padding:12px 16px 8px;position:sticky;top:0;z-index:10;background:var(--bg)}
.ah .t{flex:1;min-width:0}
.ah .eb{font-size:12.5px;color:var(--muted);font-weight:600}
.ah h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.ah .back{all:unset;cursor:pointer;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;font-size:26px;margin-left:-10px}
.pill{all:unset;cursor:pointer;min-height:48px;padding:0 14px;border-radius:24px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.ico{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:18px}
.logo{width:30px;height:30px;border-radius:8px;overflow:hidden;flex:none;margin-bottom:4px}
.logo svg{display:block;width:100%;height:100%}
main{padding:4px 16px 0;display:grid;gap:14px}
main>*,.card>*{min-width:0}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:0 0 0 1px var(--line)}
.card h2{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px 18px;display:grid;gap:4px}
.hero .lbl{color:var(--hero-2)}
.hero .v{font:700 36px/1.1 var(--mono);letter-spacing:-.03em}
.hero .s{color:var(--hero-2);font-size:14px}
.hero .prog{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:8px}
.hero .prog i{display:block;height:100%;background:var(--hero-ink);border-radius:4px}
.hero .row2{display:flex;justify-content:space-between;font-size:13.5px;color:var(--hero-2);margin-top:2px}
.li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);width:100%}
.li:first-of-type{border-top:0}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-size:17px;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:650}
.li .tx small{display:block;color:var(--muted);font-size:13px}
.li .v{text-align:right;white-space:nowrap}
.li .chev{color:var(--muted);font-size:20px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.good{background:var(--good)}
.cnt{min-width:32px;height:28px;padding:0 8px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}
.pos{color:var(--good)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.poste{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:5px;padding:10px 0;border-top:1px solid var(--line);width:100%;min-height:56px}
.poste:first-of-type{border-top:0}
.poste .l1{display:flex;justify-content:space-between;gap:8px}
.poste .l3{font-size:13px;color:var(--muted)}
.poste .l3.bad{color:var(--bad);font-weight:700} .poste .l3.warn{color:var(--warn);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;padding:0 16px;border-radius:12px;background:var(--surface-2);font-weight:650;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.lien{background:none;color:var(--accent);padding:0 4px}
.btn.dang{background:var(--bad-soft);color:var(--bad)}
.btn.w{width:100%}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{justify-content:flex-start;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-height:56px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;min-height:44px;border-radius:10px;font-weight:650;color:var(--ink-2);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cyc{display:flex;align-items:center;gap:4px}
.cyc button{all:unset;cursor:pointer;width:48px;height:48px;display:grid;place-items:center;border-radius:12px;font-size:18px}
.cyc button[disabled]{opacity:.35;cursor:default}
.cyc span{flex:1;text-align:center;font-weight:650}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;flex:none;min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:650;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip b{font-weight:800}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:0 12px;min-height:48px}
.search input{all:unset;flex:1;min-height:48px;font-size:16px}
.day{display:flex;justify-content:space-between;padding:12px 0 4px;font-weight:700;color:var(--ink-2);font-size:14px}
.op{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);width:100%}
.ops{border-radius:var(--r);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ops .op:first-child{border-top:0}
.op .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:18px;flex:none;position:relative}
.op.nv .ci::after{content:"";position:absolute;left:-6px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.op .tx{flex:1;min-width:0}
.op .tx b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .tx small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .tx small .nc{color:var(--warn);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.mini .v{font:700 18px var(--mono)}
.note{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grp-t{margin:8px 2px -6px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.toggle{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle.on{background:var(--good)} .toggle.on::after{left:24px}

/* barre d'onglets */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tb .in{max-width:480px;margin:0 auto;display:flex}
.tb button{all:unset;cursor:pointer;flex:1;min-height:var(--tb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:650;color:var(--ink-2);position:relative}
.tb button svg{width:24px;height:24px}
.tb button[aria-current="page"]{color:var(--tab-on)}
.tb button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--tab-on)}
.tb .bdg{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center}

/* volet du bas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease}
.on.scrim{opacity:1} .on.sheet{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sh-h h2{margin:0;font-size:19px;flex:1}
.x{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:18px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cat{all:unset;box-sizing:border-box;cursor:pointer;min-height:76px;border-radius:14px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:650;text-align:center;padding:6px 4px}
.cat span:first-child{font-size:22px}
.cat[aria-checked="true"]{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.field{display:grid;gap:6px;margin:10px 0}
.field input{all:unset;box-sizing:border-box;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-size:16px}
.rule{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px}
.rule .tx{flex:1}
.rule small{display:block;color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tb) + 12px);z-index:50;max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.toast button{all:unset;cursor:pointer;margin-left:auto;font-weight:800;color:var(--bg);min-height:44px;padding:0 6px;text-decoration:underline}
.vide{text-align:center;color:var(--muted);padding:22px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="mq" id="mq" role="toolbar" aria-label="Réglages de la maquette">
  <b>Maquette</b>
  <div class="grp" role="group" aria-label="Variante"><button data-var="A">A · 5 onglets</button><button data-var="B">B · 4 onglets</button></div>
  <div class="grp" role="group" aria-label="Thème"><button data-th="auto">Auto</button><button data-th="light">☀</button><button data-th="dark">☾</button></div>
  <div class="grp" role="group" aria-label="Couleurs"><button data-pal="klad">Klad</button><button data-pal="grafit">Grafit</button></div>
  <div class="cpt"><span id="cpt" aria-live="polite">0 appui</span><button id="raz" type="button">Remettre à 0</button><button class="aide" id="aide" type="button" aria-expanded="false">Guide</button></div>
</div>
<div class="mq-guide" id="guide" hidden></div>

<div class="app" id="app"></div>
<nav class="tb" id="tb" aria-label="Navigation principale"><div class="in" id="tbIn"></div></nav>
<div id="volet"></div>
<div id="toastZ"></div>

    } else if (k === 'budget') {
      if (a === 'commun') { st.budgetScope = 'commun'; st.communVue = 'mois'; vers('budget'); return; }
      st.budgetScope = 'perso'; st.budgetVue = a === 'contrats' ? 'contrats' : 'suivi'; vers('budget');
      if (a === 'obs') requestAnimationFrame(() => { const e = $('obs'); if (e) e.scrollIntoView({ block: 'start' }); });
    } else if (k === 'page') { st.pile.push(cible.slice(5)); rendre(); scrollTo(0, 0); }
  }
  function triSuivant() {
    if (!st.tri) return;
    if (st.tri.i >= st.tri.ids.length) { fermerVolet(); toast('✓ Tri terminé.'); rendre(); return; }
    const o = D.ops.find(x => x.id === st.tri.ids[st.tri.i]);
    if (st.tri.mode === 'nc' || !o.cat) ouvrirVolet(classer(o.id)); else ouvrirVolet(triVue(o));
  }
  function triVue(o) {
    return '<div class="grip" aria-hidden="true"></div><div class="sh-h"><h2 id="vt">À voir (' + (st.tri.i + 1) + ' sur ' + st.tri.ids.length + ')</h2><button class="x" data-fermer aria-label="Fermer">✕</button></div>' +
      '<div class="ops" style="margin:6px 0 12px">' + ligneOp(o) + '</div><div class="btns"><button class="btn pri w" data-act="trivue:' + o.id + '">C\'est bon, vue</button><button class="btn w" data-act="triclasser:' + o.id + '">Changer la catégorie</button><button class="btn w" data-act="passer">Passer</button></div>';
  }

  document.addEventListener('click', ev => {
    const t = ev.target;
    if (t.closest('#mq')) {
      const v = t.closest('[data-var]'), th = t.closest('[data-th]'), p = t.closest('[data-pal]');
      if (v) { st.variante = v.dataset.var; pref('variante', st.variante); history.replaceState(null, '', '#' + st.variante.toLowerCase()); st.pile = []; if (st.communVue === 'budgetc' || st.communVue === 'equilibre') st.communVue = 'mois'; rendre(); }
      else if (th) { st.theme = th.dataset.th; pref('theme', st.theme); rendre(); }
      else if (p) { st.palette = p.dataset.pal; pref('palette', st.palette); rendre(); }
      else if (t.closest('#raz')) { st.appuis = 0; $('cpt').textContent = '0 appui'; }
      else if (t.closest('#aide')) { const g = $('guide'); g.hidden = !g.hidden; $('aide').setAttribute('aria-expanded', String(!g.hidden)); }
      return;
    }
    const cible = t.closest('button, [data-act], [data-fermer]');
    if (!cible) return;
    compter();
    if (cible.closest('[data-fermer]')) { fermerVolet(); rendre(); return; }
    const tab = cible.closest('[data-tab]');
    if (tab) { if (tab.dataset.tab === 'commun' && st.variante === 'A') st.communVue = 'mois'; vers(tab.dataset.tab); return; }
    if (cible.closest('[data-retour]')) { st.pile.pop(); rendre(); return; }
    const go = cible.closest('[data-go]');
    if (go) { aller(go.dataset.go); return; }
    const sc = cible.closest('[data-scope]');
    if (sc) { st.filtre.scope = sc.dataset.scope; st.filtre.compte = ''; rendre(); return; }
    const bs = cible.closest('[data-bscope]');
    if (bs) { st.budgetScope = bs.dataset.bscope; st.communVue = 'mois'; st.tab = 'budget'; st.pile = []; rendre(); scrollTo(0, 0); return; }
    const bv = cible.closest('[data-bvue]');
    if (bv) { st.budgetVue = bv.dataset.bvue; rendre(); return; }
    const cv = cible.closest('[data-cvue]');
    if (cv) { st.communVue = cv.dataset.cvue; rendre(); return; }
    const f = cible.closest('[data-f]');
    if (f) {
      const k = f.dataset.f;
      if (k === 'nv') st.filtre.nv = !st.filtre.nv;
      else if (k === 'nc') st.filtre.nc = !st.filtre.nc;
      else if (k === 'cat') st.filtre.cat = '';
      else if (k === 'compte') st.filtre.compte = '';
      else if (k === 'catmenu') { st.filtre.cat = 'Alimentation'; toast('Liste des catégories (maquette : Alimentation choisie)'); }
      else if (k === 'comptemenu') { st.filtre.compte = 'Carte'; toast('Liste des comptes (maquette : Carte choisie)'); }
      else if (k === 'periode') toast('Période : 1, 3, 6, 12 mois, tout ou personnalisée');
      else if (k === 'internes') toast('Virements entre vos comptes et règlements déjà détaillés (maquette)');
      rendre(); return;
    }
    const op = cible.closest('[data-op]');
    if (op && !cible.closest('.sheet')) { st.pile.push('op:' + op.dataset.op); rendre(); scrollTo(0, 0); return; }
    const sh = cible.closest('[data-sheet]');
    if (sh) { ouvrirVolet(classer(sh.dataset.sheet.split(':')[1])); return; }
    const c = cible.closest('[data-cat]');
    if (c) { const id = $('volet').querySelector('[data-act^="classer:"]').dataset.act.split(':')[1]; const o = D.ops.find(x => x.id === id); if (c.dataset.cat === 'Toutes') { toast('Toutes les catégories (maquette)'); return; } o.choix = c.dataset.cat; ouvrirVolet(classer(id)); $('volet').querySelectorAll('.scrim,.sheet').forEach(e => e.classList.add('on')); return; }
    const a = cible.closest('[data-act]');
    if (!a) return;
    const [act, arg] = a.dataset.act.split(/:(.*)/);
    if (act === 'toast') toast(arg);
    else if (act === 'sync') toast('Synchronisation… relevés lus à 08:12 (maquette)');
    else if (act === 'verrou') toast('Klad se verrouille (maquette)');
    else if (act === 'annuler') { if (st.annuler) st.annuler(); $('toastZ').innerHTML = ''; rendre(); }
    else if (act === 'vue') { const o = D.ops.find(x => x.id === arg); o.vue = !o.vue; rendre(); toast(o.vue ? 'Marquée vue.' : 'Marquée non vue.', () => { o.vue = !o.vue; }); }
    else if (act === 'toutvu') { const l = D.ops.filter(o => !o.vue && (st.filtre.scope === 'tout' || o.sc === st.filtre.scope)); l.forEach(o => { o.vue = true; }); rendre(); toast(l.length + ' opération(s) marquée(s) vue(s).', () => l.forEach(o => { o.vue = false; })); }
    else if (act === 'regle') { const o = D.ops.find(x => x.id === arg); o.regle = o.regle === false; ouvrirVolet(classer(o.id)); $('volet').querySelectorAll('.scrim,.sheet').forEach(e => e.classList.add('on')); }
    else if (act === 'classer') {
      const o = D.ops.find(x => x.id === arg), avant = o.cat, n = o.kw && o.regle !== false ? o.kwN : 1;
      o.cat = o.choix; o.vue = true;
      toast(n > 1 ? n + ' opérations classées en « ' + o.choix + ' » (règle créée).' : 'Classée en « ' + o.choix + ' ».', () => { o.cat = avant; });
      if (st.tri) { st.tri.i++; rendre(); triSuivant(); } else { fermerVolet(); rendre(); }
    }
    else if (act === 'tri') {
      const scope = st.tab === 'operations' ? st.filtre.scope : 'tout';
      const mode = st.tab === 'operations' && st.filtre.nc ? 'nc' : 'nv';
      const ids = D.ops.filter(o => (scope === 'tout' || o.sc === scope) && (mode === 'nc' ? !o.cat : !o.vue)).map(o => o.id);
      if (!ids.length) { toast('Rien à trier.'); return; }
      st.tri = { ids, i: 0, mode }; triSuivant();
    }
    else if (act === 'trivue') { D.ops.find(x => x.id === arg).vue = true; st.tri.i++; rendre(); triSuivant(); }
    else if (act === 'triclasser') ouvrirVolet(classer(arg));
    else if (act === 'passer') { st.tri.i++; triSuivant(); }
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'q') { st.filtre.q = ev.target.value; const p = ev.target.selectionStart; rendre(); const q = $('q'); q.focus(); q.setSelectionRange(p, p); } });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('volet').innerHTML) { fermerVolet(); rendre(); } if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute('role') === 'switch') { ev.preventDefault(); ev.target.click(); } });
  // gestes sur les lignes d'opérations, comme dans l'appli : droite = vue, gauche = classer
  let G = null;
  document.addEventListener('touchstart', ev => { const o = ev.target.closest('.op[data-op]'); G = o && !o.closest('.sheet') ? { o, x: ev.touches[0].clientX, y: ev.touches[0].clientY } : null; }, { passive: true });
  document.addEventListener('touchend', ev => {
    if (!G) return; const dx = ev.changedTouches[0].clientX - G.x, dy = ev.changedTouches[0].clientY - G.y, id = G.o.dataset.op; G = null;
    if (Math.abs(dx) < 90 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    ev.preventDefault(); compter();
    const o = D.ops.find(x => x.id === id);
    if (dx > 0) { o.vue = !o.vue; rendre(); toast(o.vue ? 'Marquée vue.' : 'Marquée non vue.', () => { o.vue = !o.vue; }); } else ouvrirVolet(classer(id));
  });
  rendre();
})();
</script>
</body>
</html>
