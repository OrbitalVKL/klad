<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klad 2.0 — prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&family=Schibsted+Grotesk:wght@400..900&display=swap">
<style>
:root{--bg:#f3f5f2;--surface:#fff;--surface-2:#eef1ed;--ink:#14201c;--ink-2:#4a5752;--muted:#6b7671;--line:#dde2dd;--accent:#23456e;--accent-soft:#e3eaf3;
--good:#1d7f4e;--good-soft:#e2f2e8;--warn:#9a6212;--warn-soft:#fbf0dc;--bad:#b83a26;--bad-soft:#fbe6e1;--hb:#2a6fd6;
--display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root{--bg:#0c0f0e;--surface:#191e1c;--surface-2:#202624;--ink:#edf1ee;--ink-2:#b7c0bb;--muted:#939d98;--line:#2d3532;--accent:#9dbbe4;--accent-soft:#1f2c3b;
--good:#56b784;--good-soft:#1b2d23;--warn:#e2a846;--warn-soft:#2f2616;--bad:#ec7a64;--bad-soft:#35201b;--hb:#6aa5f2}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bad-t{color:var(--bad)} .pos-t{color:var(--good)} .muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
/* en-tête */
.hd{display:flex;align-items:flex-end;gap:10px;padding:14px 2px 10px}
.hd .e{font-size:12px;color:var(--muted);font-weight:600} .hd h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.hd .sync{margin-left:auto;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:700;font-size:14px;border:0}
/* blocs repris de l'appli (Accueil) */
.ac-card{background:var(--surface);border-radius:20px;padding:14px 16px;min-width:0}
.ac-card h2{display:flex;align-items:baseline;gap:8px;margin:0 0 4px;font-size:17px;font-weight:750}
.ac-card h2 .r{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.ac-li{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;border-top:1px solid var(--line)}
.ac-card h2 + .ac-li{border-top:0}
.ac-li .tx{flex:1;min-width:0} .ac-li .tx b{display:block;font-weight:650;font-size:15px} .ac-li .tx small{display:block;font-size:12.5px;color:var(--muted)}
.ac-li .v{text-align:right;font-size:14px;white-space:nowrap} .ac-li .v small{display:block;font-size:11px} .ac-li .chev{color:var(--muted);font-size:18px}
.cnt{min-width:36px;height:28px;padding:0 7px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.cnt.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin:0 13px;flex:none} .dot.warn{background:var(--warn)} .dot.good{background:var(--good)}
.bico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--bc);flex:none}
.ac-tot{margin:10px 0 0;font-size:14px} .ac-tot-s{display:block;font-size:12px;color:var(--muted)}
.cico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--cc) 18%,var(--surface));flex:none}
.cico svg{display:block}
.seg.rav-base{display:flex;padding:4px;border-radius:14px;background:var(--surface-2);gap:2px;width:100%;max-width:360px}
.seg.rav-base button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:650;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg.rav-base button[aria-pressed="true"]{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.seg.rav-base button[aria-pressed="true"]{color:#0f1a28}}
/*STYLE_AP*/
/* barre du bas */
.tb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tb .in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;align-items:flex-start}
.tb button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;min-height:52px;font-size:11px;font-weight:650;color:var(--muted);position:relative}
.tb button[aria-current="page"]{color:var(--ink)}
.tb .fab{display:grid;place-items:center;width:56px;height:56px;margin-top:-24px;border-radius:50%;background:var(--ink);color:var(--surface);box-shadow:0 6px 16px rgba(20,32,28,.25)}
.tb button[aria-current="page"] .fab{box-shadow:0 0 0 4px var(--accent-soft),0 6px 16px rgba(20,32,28,.25)}
.tb .bdg{position:absolute;top:-28px;left:calc(50% + 14px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font:800 11px/20px var(--display);text-align:center}
/* fil */
.srch{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;background:var(--surface)}
.srch input{flex:1;border:0;background:transparent;font:500 16px var(--display);color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -14px 6px;padding:0 14px 4px;scrollbar-width:none}
.chip{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chip b{font-family:var(--mono)} .chip i{width:9px;height:9px;border-radius:50%;display:block}
.jt{display:flex;justify-content:space-between;padding:14px 4px 4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.opl{background:var(--surface);border-radius:18px;padding:0 12px}
.op{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:58px;padding:8px 0;border-top:1px solid var(--line);position:relative}
.op:first-child{border-top:0}
.op .ic{position:relative} .op .ic .cico{width:38px;height:38px}
.op .per{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:4px;border:2px solid var(--surface)}
.op .t{min-width:0} .op .t b{display:block;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op.nv::before{content:"";position:absolute;left:-8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--accent)}
.op.nv .t b{font-weight:800}
.op .m{font-size:15px;font-weight:600;text-align:right} .op .m.cr{color:var(--good)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:4px;vertical-align:1px}
.nc .cico{background:transparent;border:2px dashed var(--line)}
/* tri en cartes */
.tri-h{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
.tri-h .pg{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden} .tri-h .pg i{display:block;height:100%;background:var(--ink)}
.pile{position:relative;height:400px;margin-top:14px;touch-action:none}
.pile .k{position:absolute;inset:0;background:var(--surface);border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 12px 30px rgba(20,32,28,.14);transition:transform .25s ease,opacity .25s ease;user-select:none}
.pile .k.b1{transform:translateY(12px) scale(.96);opacity:.7} .pile .k.b2{transform:translateY(24px) scale(.92);opacity:.45}
.pile .k .big .cico{width:84px;height:84px} .pile .k .big .cico svg{width:40px;height:40px}
.pile .k .mt{font:700 40px var(--mono);letter-spacing:-.04em;margin-top:16px} .pile .k .mt.cr{color:var(--good)}
.pile .k .lb{font-size:19px;font-weight:750;margin-top:6px;overflow-wrap:anywhere}
.pile .k .sb{font-size:14px;color:var(--muted);margin-top:6px}
.pile .k .prop{margin-top:auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--good-soft);color:var(--good);font-weight:750}
.pile .k .prop.nc{background:var(--warn-soft);color:var(--warn)}
.pile .k .st{position:absolute;top:18px;font:900 15px var(--display);padding:5px 12px;border-radius:10px;opacity:0;color:#fff}
.pile .k .st.ok{right:18px;background:var(--good);transform:rotate(8deg)} .pile .k .st.ch{left:18px;background:var(--warn);transform:rotate(-8deg)} .pile .k .st.pl{left:50%;margin-left:-44px;background:var(--ink-2)}
.gst{display:flex;justify-content:space-around;margin-top:22px}
.gst button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2)}
.gst span.r{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.gst .ch .r{background:var(--warn-soft);color:var(--warn)} .gst .pl .r{background:var(--surface-2)} .gst .ok .r{background:var(--good-soft);color:var(--good)}
.fin{text-align:center;padding:60px 10px;font-size:18px;font-weight:700}
/* volet */
.dim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.sheet .hdl{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cgrid button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);font-size:12px;font-weight:650;text-align:center;hyphens:auto}
.cgrid .cico{width:40px;height:40px}
/* écrans inchangés */
.inch{display:grid;gap:10px}
.inch .ac-card p{margin:6px 0 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.proto{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 0}
</style>
</head>
<body>
<header class="hd"><div><div class="e" id="hd-e"></div><h1 id="hd-t">Aperçu</h1></div><button class="sync" type="button" data-toast="Synchronisation : rien à faire dans ce prototype (données fictives).">✓ Synchroniser</button></header>
<main id="vue"></main>
<p class="proto">Prototype Klad 2.0 · données fictives au 28/10/2026 · rien n'est enregistré</p>
<nav class="tb" aria-label="Navigation principale"><div class="in">
  <button type="button" data-tab="apercu" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>Aperçu</button>
  <button type="button" data-tab="fil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Opérations</button>
  <button type="button" data-tab="trier" aria-label="Trier les opérations à vérifier"><span class="fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M7 5h10"/><path d="M9 2.5h6"/></svg></span>Trier<span class="bdg" id="bdg"></span></button>
  <button type="button" data-tab="patri"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7M10 10.5v7M14 10.5v7M18.5 10.5v7"/><path d="M3 20h18"/></svg>Patrimoine</button>
  <button type="button" data-tab="plus"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Plus</button>
</div></nav>
<script>
/*DONNEES*/
(function () {
  'use strict';
  const $ = s => document.querySelector(s), vue = $('#vue');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = c => (Math.abs(c) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const pli = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const jourL = iso => iso === DATA.fin ? 'Aujourd\'hui' : JOURS[new Date(iso + 'T12:00:00Z').getUTCDay()] + ' ' + (+iso.slice(8, 10)) + '/' + iso.slice(5, 7);
  let onglet = 'apercu', cote = 'moi', base = 'salaire', toastT = null;
  const fait = new Set(), classe = {};
  let filtre = { q: '', f: 'tout' }, tri = null;
  const aTrier = () => DATA.ops.filter(o => o.av && !fait.has(o.id));
  function toast(t) {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600);
  }
  const ECRANS = { rav: 'le détail du calcul du reste à vivre', budget: 'Budget › Suivi (écran actuel)', tendance: 'Budget › Tendance (écran actuel)', 'contrats-perso': 'Budget › Contrats (écran actuel)',
    commun: 'Commun › Ce mois (écran actuel)', tresorerie: 'Commun › Trésorerie (écran actuel)', equilibre: 'l\'Équilibre de l\'indivision (écran actuel)', 'contrats-commun': 'les contrats du commun (écran actuel)',
    observations: 'toutes les observations', sauvegarde: 'Plus › Sauvegarde', bilan: 'le bilan du cycle précédent', comptes: 'Plus › Comptes', banques: 'Plus › Banques et accès', maj: 'la mise à jour' };
  const allerVers = k => toast('Dans l\'appli, ce bouton ouvre ' + (ECRANS[k] || 'l\'écran détaillé') + '.');

  // ------------------------------------------------------------ Aperçu
  function apercu() {
    const h = cote === 'nous' ? DATA.nous : base === 'comptes' ? DATA.moiComptes : DATA.moiSalaire;
    vue.innerHTML = '<div class="ap-seg" role="tablist" aria-label="Aperçu"><button type="button" role="tab" data-apcote="moi" aria-selected="' + (cote === 'moi') + '"><i class="moi"></i>Moi</button>' +
      '<button type="button" role="tab" data-apcote="nous" aria-selected="' + (cote === 'nous') + '"><i class="nous"></i>Nous</button></div><div class="ap-page">' + h + '</div>' +
      '<div class="ap-dots" aria-hidden="true"><i class="' + (cote === 'moi' ? 'on' : '') + '"></i><i class="' + (cote === 'nous' ? 'on' : '') + '"></i></div>';
  }
  // ------------------------------------------------------------ Opérations
  function montant(q) {
    const t = String(q).trim();
    if (!/^\d[\d\s  ]*([.,]\d{1,2})?\s*€?$/.test(t) || !/[.,€]/.test(t)) return null;
    const m = t.replace(/[\s  €]/g, '').replace('.', ',').match(/^(\d*)(?:,(\d{0,2}))?$/);
    return m ? (+m[1] || 0) * 100 + +((m[2] || '') + '00').slice(0, 2) : null;
  }
  function fil() {
    const L = DATA.ops, nv = L.filter(o => !o.vu).length, nc = L.filter(o => o.nc).length;
    const ch = (k, t, n, c) => '<button type="button" class="chip" data-f="' + k + '" aria-pressed="' + (filtre.f === k) + '">' + (c ? '<i style="background:' + c + '"></i>' : '') + t + (n != null ? ' <b>' + n + '</b>' : '') + '</button>';
    vue.innerHTML = '<label class="srch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>' +
      '<input id="q" type="search" placeholder="Libellé ou montant (34,65)" value="' + esc(filtre.q) + '" aria-label="Rechercher un libellé ou un montant"></label>' +
      '<div class="chips">' + ch('tout', 'Toutes') + ch('nv', 'Non vues', nv, 'var(--accent)') + ch('nc', 'Non classées', nc) + ch('moi', 'Moi', null, 'var(--ap-moi)') + ch('nous', 'Nous', null, 'var(--ap-nous)') + '</div><div id="liste"></div>';
    liste();
  }
  function liste() {
    const q = filtre.q.trim(), mq = q ? montant(q) : null, k = pli(q);
    const L = DATA.ops.filter(o => (filtre.f === 'tout' || (filtre.f === 'nv' && !o.vu) || (filtre.f === 'nc' && o.nc) || (filtre.f === 'moi' && !o.nous) || (filtre.f === 'nous' && o.nous)) &&
      (!q || (mq != null ? Math.abs(o.m) === mq : pli(o.l + ' ' + o.cat + ' ' + o.sub).indexOf(k) >= 0)));
    const par = {}; for (const o of L) (par[o.d] || (par[o.d] = [])).push(o);
    const jours = Object.keys(par).sort().reverse();
    $('#liste').innerHTML = jours.length ? jours.map(j => {
      const tot = par[j].reduce((t, o) => t + o.m, 0);
      return '<div class="jt"><span>' + esc(jourL(j)) + '</span><span class="num">' + (tot > 0 ? '+' : '') + esc(eur(tot)) + '</span></div><div class="opl">' + par[j].map(o =>
        '<div class="op' + (o.vu || fait.has(o.id) ? '' : ' nv') + (o.nc && !classe[o.id] ? ' nc' : '') + '"><span class="ic">' + (classe[o.id] ? classe[o.id].ic : o.ic) + '<i class="per" style="background:var(--ap-' + (o.nous ? 'nous' : 'moi') + ')"></i></span>' +
        '<span class="t"><b>' + esc(o.l) + '</b><small>' + esc((classe[o.id] ? classe[o.id].n : o.nc ? 'Non classée' : o.cat + (o.sub ? ' · ' + o.sub : '')) + ' · ' + o.c) + (o.ec ? '<span class="tag">en cours</span>' : '') + (o.int ? '<span class="tag">interne</span>' : '') + '</small></span>' +
        '<span class="m num' + (o.m > 0 ? ' cr' : '') + '">' + (o.m > 0 ? '+' : '') + esc(eur(o.m)) + '</span></div>').join('') + '</div>';
    }).join('') : '<p class="note" style="text-align:center;padding:30px 0">Aucune opération ne correspond.</p>';
  }
  // ------------------------------------------------------------ Trier (cartes)
  function trier() {
    const F = aTrier();
    if (!tri) tri = { n: F.length + fait.size, i: 0 };
    if (!F.length) { vue.innerHTML = '<div class="fin">✓ Tout est trié.<p class="note">Dans l\'appli, la file comprend les opérations non vues, non classées depuis 3 mois et à rapprocher.</p></div>'; return; }
    const k = (o, cls) => '<div class="k ' + cls + '" data-op="' + esc(o.id) + '"><span class="st ok">OK</span><span class="st ch">CHANGER</span><span class="st pl">PLUS TARD</span>' +
      '<span class="big">' + o.ic + '</span><span class="mt' + (o.m > 0 ? ' cr' : '') + '">' + (o.m > 0 ? '+' : '') + esc(eur(o.m)) + '</span><span class="lb">' + esc(o.l) + '</span>' +
      '<span class="sb">' + esc(jourL(o.d)) + ' · ' + esc(o.c) + (o.vu ? '' : ' · non vue') + '</span>' +
      (o.nc ? '<span class="prop nc">? Non classée</span>' : '<span class="prop">' + esc(o.cat + (o.sub ? ' · ' + o.sub : '')) + ' ✓</span>') + '</div>';
    const n = tri.n, fini = n - F.length;
    vue.innerHTML = '<div class="tri-h"><span class="pg"><i style="width:' + Math.round(fini / Math.max(1, n) * 100) + '%"></i></span><b class="num">' + (fini + 1) + ' / ' + n + '</b></div>' +
      '<div class="pile">' + (F[2] ? k(F[2], 'b2') : '') + (F[1] ? k(F[1], 'b1') : '') + k(F[0], 'top') + '</div>' +
      '<div class="gst"><button type="button" class="ch" data-g="ch"><span class="r">✎</span>← Changer</button><button type="button" class="pl" data-g="pl"><span class="r">⏭</span>↑ Plus tard</button><button type="button" class="ok" data-g="ok"><span class="r">✓</span>C\'est bon →</button></div>';
    glisser($('.pile .k.top'));
  }
  function agir(g) {
    const o = aTrier()[0];
    if (!o) return;
    if (g === 'ch') { choisirCat(o); return; }
    if (g === 'pl') { DATA.ops.push(DATA.ops.splice(DATA.ops.indexOf(o), 1)[0]); }
    else { if (o.nc && !classe[o.id]) { choisirCat(o); return; } fait.add(o.id); o.vu = true; }
    majBadge(); trier();
  }
  function glisser(el) {
    if (!el) return;
    let x0 = null, y0 = 0, dx = 0, dy = 0;
    el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
    el.addEventListener('pointermove', e => {
      if (x0 == null) return;
      dx = e.clientX - x0; dy = e.clientY - y0;
      el.style.transform = 'translate(' + dx + 'px,' + Math.min(0, dy) + 'px) rotate(' + dx / 18 + 'deg)';
      el.querySelector('.st.ok').style.opacity = Math.max(0, Math.min(1, dx / 90));
      el.querySelector('.st.ch').style.opacity = Math.max(0, Math.min(1, -dx / 90));
      el.querySelector('.st.pl').style.opacity = Math.abs(dx) < 50 ? Math.max(0, Math.min(1, -dy / 90)) : 0;
    });
    const fin = () => {
      if (x0 == null) return;
      x0 = null; el.style.transition = '';
      const g = dx > 100 ? 'ok' : dx < -100 ? 'ch' : dy < -110 && Math.abs(dx) < 60 ? 'pl' : null;
      if (g === 'ok' || g === 'pl') { el.style.transform = g === 'ok' ? 'translate(140%,0) rotate(18deg)' : 'translate(0,-140%)'; el.style.opacity = 0; setTimeout(() => agir(g), 220); }
      else { el.style.transform = ''; el.querySelectorAll('.st').forEach(s => { s.style.opacity = 0; }); if (g === 'ch') agir('ch'); }
      dx = dy = 0;
    };
    el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  }
  function choisirCat(o) {
    fermer();
    const d = document.createElement('div'); d.className = 'dim'; d.addEventListener('click', fermer);
    const s = document.createElement('div'); s.className = 'sheet'; s.setAttribute('role', 'dialog'); s.setAttribute('aria-label', 'Classer');
    s.innerHTML = '<div class="hdl"></div><h3>Classer « ' + esc(o.l) + ' »</h3><div class="cgrid">' + DATA.cats.map((c, i) => '<button type="button" data-cat="' + i + '">' + c.ic + esc(c.n) + '</button>').join('') + '</div>';
    s.addEventListener('click', e => {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      const c = DATA.cats[+b.dataset.cat]; classe[o.id] = c; o.nc = false; o.cat = c.n; o.sub = ''; o.ic = c.ic; fait.add(o.id); o.vu = true;
      fermer(); toast('Classée en « ' + c.n + ' ». Dans l\'appli : « Classer aussi les autres » proposé.'); majBadge(); trier();
    });
    document.body.append(d, s);
  }
  function fermer() { document.querySelectorAll('.dim, .sheet').forEach(x => x.remove()); }
  // ------------------------------------------------------------ Patrimoine, Plus : écrans inchangés
  const inchange = (titre, L) => '<div class="inch">' + L.map(([t, p]) => '<section class="ac-card"><h2>' + esc(t) + '</h2><p>' + esc(p) + '</p></section>').join('') +
    '<p class="note" style="text-align:center">' + esc(titre) + ' : écrans de la 1.3.6, inchangés dans ce lot (prochaine étape : tuiles).</p></div>';
  function patri() {
    vue.innerHTML = inchange('Patrimoine', [['Impôts', 'Résumé (impôt estimé, déjà prélevé, à régulariser entre vous), Prélèvements à la source, Paramètres et avis.'],
      ['Foncier', 'Taxe foncière : estimation, avis, partage, échéance.'], ['Épargne', 'Livret (taux, intérêts estimés), Plan d\'épargne entreprise (fonds, versements, règles).'], ['Crypto', 'Positions saisies à la main, valeur à mettre à jour.']]);
  }
  function plus() {
    vue.innerHTML = inchange('Plus', [['Comptes et banques', 'Banques et accès, Comptes, Relevés des comptes.'], ['Données', 'Sauvegarde (export vérifiable, restauration), Importer, Contrôle.'],
      ['Modules et extras', 'Lien Grafit, Mail et Claude.'], ['Réglages', 'Apparence, Verrou, Classement, Budget, Complément.'], ['Aide', 'À propos et mise à jour, Journal, Diagnostic d\'affichage.']]);
  }
  // ------------------------------------------------------------ navigation
  const TITRES = { apercu: 'Aperçu', fil: 'Opérations', trier: 'Trier', patri: 'Patrimoine', plus: 'Plus' };
  function majBadge() { const n = aTrier().length; $('#bdg').textContent = n > 99 ? '99+' : n; $('#bdg').hidden = !n; }
  function montrer(t) {
    onglet = t; fermer();
    document.querySelectorAll('.tb [data-tab]').forEach(b => { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    $('#hd-t').textContent = TITRES[t]; $('#hd-e').textContent = t === 'apercu' ? DATA.cycle : t === 'fil' ? '3 derniers mois · Moi et Nous' : '';
    ({ apercu, fil, trier, patri, plus })[t]();
    window.scrollTo(0, 0);
  }
  document.querySelector('.tb').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) montrer(b.dataset.tab); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-toast]'); if (t) { toast(t.dataset.toast); return; }
    const a = e.target.closest('[data-apcote]'); if (a) { cote = a.dataset.apcote; apercu(); return; }
    const r = e.target.closest('[data-ravbase]'); if (r && !r.disabled) { base = r.dataset.ravbase; apercu(); return; }
    const f = e.target.closest('[data-f]'); if (f) { filtre.f = f.dataset.f; fil(); return; }
    const g = e.target.closest('[data-g]'); if (g) { agir(g.dataset.g); return; }
    const av = e.target.closest('[data-av]');
    if (av) { const k = av.dataset.av; if (k === 'averifier') { tri = null; montrer('trier'); } else allerVers(k); return; }
    const al = e.target.closest('[data-aller]'); if (al) { allerVers(al.dataset.aller); return; }
    const c = e.target.closest('[data-compte]'); if (c) { filtre = { q: '', f: 'tout' }; montrer('fil'); toast('Dans l\'appli : les opérations de ce compte.'); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'q') { filtre.q = e.target.value; liste(); } });
  // glisser Moi ⇄ Nous
  let sx = null, sy = 0;
  vue.addEventListener('touchstart', e => { if (onglet !== 'apercu' || e.target.closest('.ap-days')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  vue.addEventListener('touchend', e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
    if (dx < 0 && cote === 'moi') { cote = 'nous'; apercu(); window.scrollTo(0, 0); } else if (dx > 0 && cote === 'nous') { cote = 'moi'; apercu(); window.scrollTo(0, 0); }
  }, { passive: true });
  majBadge(); montrer('apercu');
})();
</script>
</body>
</html>
